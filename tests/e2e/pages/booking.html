<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Booking test page</title>
  <style>
    body { font: 15px system-ui, sans-serif; margin: 24px; }
    .seats { display: grid; grid-template-columns: repeat(6, 44px); gap: 6px; }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <!-- Cases that trip up locators: names contained in other names, duplicate
       buttons, generated ids, hidden twins, aria-labelledby, icon buttons. -->
  <header>
    <nav aria-label="Main">
      <a href="#events">Events</a>
      <a href="#orders">My orders</a>
      <button>Sign in</button>
      <button>Sign in with demo key</button>
    </nav>
  </header>
  <main>
    <h1>Upcoming events</h1>
    <section aria-labelledby="ev-title" id="events">
      <h2 id="ev-title">Event 2</h2>
      <p>Venue 3 · Sun, Jan 3</p>
      <p><strong>40 seats left</strong></p>
      <div class="seats" role="group" aria-label="Seats">
        <button aria-pressed="false" aria-label="Seat R1-1">1</button>
        <button aria-pressed="false" aria-label="Seat R1-2">2</button>
        <button aria-pressed="false" aria-label="Seat R1-10">10</button>
        <button aria-pressed="false" aria-label="Seat R1-11" disabled>11</button>
      </div>
      <p>Total: <span data-testid="total">$50.00</span></p>
      <button data-testid="buy">Buy 2 seats</button>
      <button style="display:none">Buy 2 seats</button>
    </section>

    <form id=":r7:" aria-label="Checkout">
      <label for="name">Name</label> <input id="name" autocomplete="off">
      <label for="card-name">Name on card</label> <input id="card-name">
      <label>Email <input type="email" placeholder="you@example.com"></label>
      <input type="search" placeholder="Search events">
      <label><input type="checkbox"> Send me a receipt</label>
      <fieldset>
        <legend>Delivery</legend>
        <label><input type="radio" name="d" checked> E-ticket</label>
        <label><input type="radio" name="d"> Post</label>
      </fieldset>
      <label for="qty">Quantity</label>
      <select id="qty"><option>1</option><option>2</option></select>
      <span id="notes-label">Notes for the venue</span>
      <textarea aria-labelledby="notes-label"></textarea>
      <input type="submit" value="Pay now">
    </form>

    <section aria-label="Orders" id="orders">
      <h2>My orders</h2>
      <ul>
        <li class="row">Order #12 <button data-testid="delete-12">Delete</button></li>
        <li class="row">Order #13 <button data-testid="delete-13">Delete</button></li>
        <li class="row">Order #14 <button>Delete</button></li>
      </ul>
      <button aria-label="Close" title="Close">✕</button>
      <button title="Refresh orders"><svg aria-hidden="true" width="12" height="12"></svg></button>
      <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Venue map" width="40" height="20">
      <div role="status">Order confirmed</div>
      <div id="react-17"><span>Don't panic — it's "fine"</span></div>
      <div><span>Plain box</span><span>Plain box</span></div>
    </section>
  </main>
  <script>
    // Page behaviour the lens must not trigger while it's on.
    window.clicks = 0;
    document.addEventListener("click", () => { window.clicks++; });
  </script>
</body>
</html>
